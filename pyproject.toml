[project]
name = "dsan6000-hw04"
version = "0.1.0"
description = "DSAN 6000 HW4: Working With Columnar Data in DuckDB"
readme = "README.md"
authors = [
    { name = "Jeff Jacobs", email = "jjacobs3@cs.stanford.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "seaborn>=0.13.2",
]

[project.scripts]
dsan6000-hw04 = "dsan6000_hw04:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
